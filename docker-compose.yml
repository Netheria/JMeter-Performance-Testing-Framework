version: '3.8'

services:
  jmeter:
    build:
      context: .
      dockerfile: .docker/jmeter/Dockerfile
    container_name: jmeter
    image: jmeter:5.5-custom
    environment:
      JMETER_HEAP: ${JMETER_HEAP:-2g}
      CONCURRENT_AGENTS: ${CONCURRENT_AGENTS:-5}
      AGENT_RAMPUP: ${AGENT_RAMPUP:-120}
      CONCURRENT_CLIENTS: ${CONCURRENT_CLIENTS:-3}
      CLIENT_RAMPUP: ${CLIENT_RAMPUP:-120}
      DB_HOST: ${DB_HOST:-192.0.2.10}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-testapp_user}
      DB_PASSWORD: ${DB_PASSWORD:-demo_password}
      DB_NAME: ${DB_NAME:-testapp_db}
      INFLUXDB_URL: ${INFLUXDB_URL:-http://influxdb:8086}
      INFLUXDB_DB: ${INFLUXDB_DB:-jmeter_metrics}
      INFLUXDB_USER: ${INFLUXDB_USER:-jmeter}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD:-jmeter_password}
      BUILD_TAG: ${BUILD_TAG:-local-test}
      COMPARE_BUILD_TAG: ${COMPARE_BUILD_TAG:-baseline}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-demo_api_token}
      ACCOUNT_ID: ${ACCOUNT_ID:-1}
      INBOX_ID: ${INBOX_ID:-1}
      TEAM_ID: ${TEAM_ID:-1}
    volumes:
      - ./flows:/opt/jmeter/flows:ro
      - ./resources:/opt/jmeter/resources:ro
      - ./results:/opt/jmeter/results:rw
      - ./bin/test.properties:/opt/jmeter/bin/test.properties:ro
    networks:
      - jmeter_stack
    depends_on:
      influxdb:
        condition: service_healthy

  influxdb:
    # InfluxDB 1.8 — compatible with Chronograf admin UI
    # Note: Version 2.x would require Chronograf UI updates
    image: influxdb:1.8
    container_name: influxdb
    restart: always
    ports:
      - "8087:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb
      - ./influxdb/config/:/etc/influxdb/
    environment:
      - AUTH_ENABLED=false
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_ADMIN_USER=${INFLUXDB_USER:-jmeter}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD:-jmeter_password}
      - INFLUXDB_DB=${INFLUXDB_DB:-jmeter_metrics}
    networks:
      - jmeter_stack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chronograf:
    image: chronograf:latest
    container_name: chronograf
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - ./chronograf/data/:/var/lib/chronograf/
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=${INFLUXDB_USER:-jmeter}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD:-jmeter_password}
    depends_on:
      - influxdb
    networks:
      - jmeter_stack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  jmeter_stack:
    driver: bridge
